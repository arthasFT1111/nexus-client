plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Brapi — библиотека для гладких скруглений (modImplementation + include)
    modImplementation "maven.modrinth:4kGyjaWF:0.26+1.21.11+fabric"
    include "maven.modrinth:4kGyjaWF:0.26+1.21.11+fabric"

    // Lombok — для @Getter, @Setter, @AllArgsConstructor и т.д.
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // JavaFX — для музыкального плеера (MusicFxApp)
    def javafxVersion = "21.0.7"
    implementation "org.openjfx:javafx-base:${javafxVersion}:win"
    include "org.openjfx:javafx-base:${javafxVersion}:win"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:win"
    include "org.openjfx:javafx-graphics:${javafxVersion}:win"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:win"
    include "org.openjfx:javafx-controls:${javafxVersion}:win"
    implementation "org.openjfx:javafx-media:${javafxVersion}:win"
    include "org.openjfx:javafx-media:${javafxVersion}:win"
    implementation "org.openjfx:javafx-web:${javafxVersion}:win"
    include "org.openjfx:javafx-web:${javafxVersion}:win"

    // Netty — для Proxy (Socks5ProxyHandler)
    implementation "io.netty:netty-handler-proxy:4.1.117.Final"
    include "io.netty:netty-handler-proxy:4.1.117.Final"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}